
# backtick prefix
unbind C-b
set -g prefix `
bind ` send-prefix

# tmux paste behavior
set -g set-clipboard on          # Allow tmux to talk to system clipboard
set -g focus-events on           # Better paste handling across apps
set -g mouse on                  # Keep mouse support
bind ] run-shell "tmux paste-buffer -p"   # -p = bracketed paste (cleaner)



